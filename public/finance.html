<style>
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:.5rem}
.fin-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
.fin-card{background:#fff;border-radius:10px;padding:1rem;border:1px solid var(--border)}
.fin-card .label{font-size:.8rem;color:#888;text-transform:uppercase;letter-spacing:.03em}
.fin-card .value{font-size:1.3rem;font-weight:700;margin-top:.2rem}
.fin-card .value.moss{color:var(--moss)}
.fin-card .value.clay{color:var(--clay)}
.fin-card .value.marigold{color:var(--marigold)}
.btn{background:var(--moss);color:#fff;border:none;padding:.5rem 1.2rem;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:500}
.btn:hover{background:var(--moss-deep)}
.btn-s{padding:.3rem .8rem;font-size:.85rem}
.btn-danger{background:var(--clay)}
.btn-danger:hover{background:#b13a2a}
.form-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center}
.form-overlay.open{display:flex}
.form-card{background:#fff;border-radius:12px;padding:2rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.form-card h2{margin-top:0}
.form-card label{display:block;font-size:.85rem;font-weight:600;margin-top:1rem;margin-bottom:.3rem;color:var(--moss-deep)}
.form-card input,.form-card select,.form-card textarea{width:100%;padding:.55rem .7rem;border:1.5px solid #ddd;border-radius:6px;font-family:inherit;font-size:.9rem}
.form-card .form-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.5rem}
.table-wrap{overflow-x:auto;background:#fff;border-radius:10px;border:1px solid var(--border);margin-bottom:1.5rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:.7rem 1rem;text-align:left;border-bottom:1px solid #eee}
th{background:#f9faf8;font-weight:600;color:var(--moss-deep);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
.filters{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.filters select{padding:.4rem .6rem;border:1.5px solid #ddd;border-radius:6px;font-family:inherit;font-size:.85rem}
</style>
</head>
<body>

<main>
<div class="topbar">
<div><div class="eyebrow">Financial Management</div><h1>Finance</h1></div>
<div class="topbar-meta"><span id="currentDate"></span></div>
</div>
<div class="fin-summary" id="summaryCards"></div>
<div class="page-header">
<div class="filters">
<select id="catFilter" onchange="loadExpenses()"><option value="">All categories</option></select>
<select id="progFilter" onchange="loadExpenses()"><option value="">All programs</option></select>
</div>
<button class="btn" id="addBtn">+ Add Expense</button>
</div>
<div class="table-wrap">
<table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Program</th><th style="text-align:right">Amount</th><th></th></tr></thead>
<tbody id="tableBody"></tbody></table>
</div>
</main>
</div>
<div class="form-overlay" id="formOverlay">
<div class="form-card">
<h2>Add Expense</h2>
<label>Description</label><input id="fDesc" required />
<label>Amount (<span class="currency-symbol">₹</span>)</label><input id="fAmount" type="number" step="0.01" required />
<label>Category</label>
<select id="fCategory"><option>Materials</option><option>Labour</option><option>Supplies</option><option>Medical</option><option>Training</option><option>Salary</option><option>Admin</option><option>Travel</option><option>Other</option></select>
<label>Program</label><select id="fProgram"><option value="">— None (overhead) —</option></select>
<label>Date</label><input id="fDate" type="date" />
<div class="form-actions"><button class="btn btn-danger" id="cancelBtn">Cancel</button><button class="btn" id="saveBtn">Save</button></div>
</div>
</div>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/org-loader.js"></script>
<script>
async function loadExpenses() {
  await window.orgSettingsPromise;
  const params = {};
  const cat = document.getElementById('catFilter').value;
  if (cat) params.category = cat;
  const prog = document.getElementById('progFilter').value;
  if (prog) params.program_id = prog;
  const q = Object.keys(params).length ? '?' + new URLSearchParams(params).toString() : '';
  const res = await api('GET', '/api/expenses' + q);

  document.getElementById('summaryCards').innerHTML = `
    <div class="fin-card"><div class="label">Total Income (Donations)</div><div class="value moss">${window.formatCurrency(res.total_income || 0)}</div></div>
    <div class="fin-card"><div class="label">Total Expenses</div><div class="value clay">${window.formatCurrency(res.total_expenses)}</div></div>
    <div class="fin-card"><div class="label">Net Balance</div><div class="value marigold">${window.formatCurrency((res.total_income || 0) - res.total_expenses)}</div></div>
  `;

  const tbody = document.getElementById('tableBody');
  if (!res.expenses.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888;padding:2rem">No expenses recorded.</td></tr>';
    return;
  }
  tbody.innerHTML = res.expenses.map(e => `
    <tr>
      <td>${e.expense_date || e.created_at}</td>
      <td><strong>${e.description}</strong></td>
      <td><span class="pill" style="background:#f0f0f0;color:#555">${e.category}</span></td>
      <td>${e.program_name || '—'}</td>
      <td style="text-align:right;font-weight:600">${window.formatCurrency(e.amount)}</td>
      <td><button class="btn btn-s btn-danger" onclick="deleteExpense(${e.id})">Delete</button></td>
    </tr>
  `).join('');
}

window.deleteExpense = async (id) => {
  if (!confirm('Delete this expense?')) return;
  await api('DELETE', `/api/expenses/${id}`);
  loadExpenses();
};

async function loadDropdowns() {
  try {
    const { programs } = await getPrograms();
    const progOpts = programs.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    document.getElementById('progFilter').innerHTML = '<option value="">All programs</option>' + progOpts;
    document.getElementById('fProgram').innerHTML = '<option value="">— None (overhead) —</option>' + progOpts;
  } catch(e) {}
}

document.getElementById('addBtn').addEventListener('click', () => {
  ['fDesc','fAmount'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fCategory').value = 'Other';
  document.getElementById('fProgram').value = '';
  document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('formOverlay').classList.add('open');
});
document.getElementById('cancelBtn').addEventListener('click', () => document.getElementById('formOverlay').classList.remove('open'));
document.getElementById('saveBtn').addEventListener('click', async () => {
  const data = {
    description: document.getElementById('fDesc').value,
    amount: parseFloat(document.getElementById('fAmount').value),
    category: document.getElementById('fCategory').value,
    program_id: parseInt(document.getElementById('fProgram').value) || null,
    expense_date: document.getElementById('fDate').value || null
  };
  if (!data.description || !data.amount) return alert('Description and amount are required');
  await api('POST', '/api/expenses', data);
  document.getElementById('formOverlay').classList.remove('open');
  loadExpenses();
});

(async () => {
  const user = await getCurrentUser();
  if (!user) { window.location.href = '/login.html'; return; }
  document.getElementById('logoutBtn').addEventListener('click', async () => { await logout(); window.location.href = '/login.html'; });
  document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  await loadDropdowns();
  loadExpenses();
})();
</script>
</body>
