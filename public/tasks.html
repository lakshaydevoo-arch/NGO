<style>
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:.5rem}
.filters{display:flex;gap:.5rem;flex-wrap:wrap}
.filters select{padding:.4rem .6rem;border:1.5px solid #ddd;border-radius:6px;font-family:inherit;font-size:.85rem}
.btn{background:var(--moss);color:#fff;border:none;padding:.5rem 1.2rem;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:500}
.btn:hover{background:var(--moss-deep)}
.btn-s{padding:.3rem .8rem;font-size:.85rem}
.btn-danger{background:var(--clay)}
.btn-danger:hover{background:#b13a2a}
.form-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center}
.form-overlay.open{display:flex}
.form-card{background:#fff;border-radius:12px;padding:2rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.form-card h2{margin-top:0}
.form-card label{display:block;font-size:.85rem;font-weight:600;margin-top:1rem;margin-bottom:.3rem;color:var(--moss-deep)}
.form-card input,.form-card select,.form-card textarea{width:100%;padding:.55rem .7rem;border:1.5px solid #ddd;border-radius:6px;font-family:inherit;font-size:.9rem}
.form-card textarea{min-height:70px}
.form-card .form-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.5rem}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1rem}
.kanban-col{background:#f5f7f5;border-radius:10px;padding:1rem;min-height:200px}
.kanban-col h3{font-size:.9rem;text-transform:uppercase;letter-spacing:.03em;color:var(--moss-deep);margin:0 0 .8rem}
.task-card{background:#fff;border-radius:8px;padding:.8rem;margin-bottom:.6rem;border:1px solid var(--border);font-size:.85rem}
.task-card .title{font-weight:600;margin-bottom:.3rem}
.task-card .meta{font-size:.8rem;color:#888}
.task-card .actions{margin-top:.5rem;display:flex;gap:.3rem}
.pill{display:inline-block;padding:.1rem .4rem;border-radius:12px;font-size:.75rem;font-weight:500}
.pill.high{background:#fde8e8;color:#b13a2a}
.pill.medium{background:#fef3d0;color:#8a702a}
.pill.low{background:#e8f0e8;color:#2a6e3a}
.pill.pending{background:#f0f0f0;color:#666}
.pill.in_progress{background:#d0e8f0;color:#2a5a7a}
.pill.completed{background:#d0f0d0;color:#2a6e3a}
</style>
</head>

<main>
<div class="topbar"><div><div class="eyebrow">Task Management</div><h1>Tasks</h1></div><div class="topbar-meta"><span id="currentDate"></span></div></div>
<div class="page-header">
<div class="filters">
<select id="progFilter" onchange="loadTasks()"><option value="">All programs</option></select>
</div>
<button class="btn" id="addBtn">+ New Task</button>
</div>
<div class="kanban" id="kanban"></div>
</main>
</div>
<div class="form-overlay" id="formOverlay">
<div class="form-card"><h2 id="formTitle">New Task</h2>
<label>Title</label><input id="fTitle" required />
<label>Description</label><textarea id="fDesc"></textarea>
<label>Assigned To</label><input id="fAssigned" />
<label>Program</label><select id="fProgram"><option value="">— None —</option></select>
<label>Priority</label><select id="fPriority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select>
<label>Status</label><select id="fStatus"><option value="pending">Pending</option><option value="in_progress">In Progress</option><option value="completed">Completed</option></select>
<label>Due Date</label><input id="fDue" type="date" />
<div class="form-actions"><button class="btn btn-danger" id="cancelBtn">Cancel</button><button class="btn" id="saveBtn">Save</button></div>
</div></div>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/org-loader.js"></script>
<script>
let editingId = null;
async function loadTasks() {
  const params = {};
  const p = document.getElementById('progFilter').value;
  if (p) params.program_id = p;
  const q = Object.keys(params).length ? '?' + new URLSearchParams(params).toString() : '';
  const res = await api('GET', '/api/tasks' + q);
  const cols = { pending: [], in_progress: [], completed: [] };
  res.tasks.forEach(t => { if (cols[t.status]) cols[t.status].push(t); else cols.pending.push(t); });
  const labels = { pending: 'To Do', in_progress: 'In Progress', completed: 'Completed' };
  document.getElementById('kanban').innerHTML = ['pending','in_progress','completed'].map(status => `
    <div class="kanban-col">
      <h3>${labels[status]} (${cols[status].length})</h3>
      ${cols[status].map(t => `
        <div class="task-card">
          <div class="title">${t.title}</div>
          <div class="meta">${t.assigned_to ? '👤 ' + t.assigned_to : ''} ${t.program_name ? '· ' + t.program_name : ''} ${t.due_date ? '· 📅 ' + t.due_date : ''}</div>
          <div style="margin-top:.3rem"><span class="pill ${t.priority}">${t.priority}</span> <span class="pill ${t.status}">${t.status.replace('_',' ')}</span></div>
          <div class="actions">
            <button class="btn btn-s" onclick="editTask(${t.id})">Edit</button>
            <button class="btn btn-s btn-danger" onclick="deleteTask(${t.id})">Delete</button>
          </div>
        </div>`).join('')}
    </div>`).join('');
}
window.editTask = async (id) => {
  editingId = id;
  const res = await api('GET', '/api/tasks?id=0'); // just get all, find by id
  const allTasks = res.tasks;
  const task = allTasks.find(t => t.id === id);
  if (!task) return;
  document.getElementById('formTitle').textContent = 'Edit Task';
  document.getElementById('fTitle').value = task.title;
  document.getElementById('fDesc').value = task.description || '';
  document.getElementById('fAssigned').value = task.assigned_to || '';
  document.getElementById('fProgram').value = task.program_id || '';
  document.getElementById('fPriority').value = task.priority || 'medium';
  document.getElementById('fStatus').value = task.status || 'pending';
  document.getElementById('fDue').value = task.due_date || '';
  document.getElementById('formOverlay').classList.add('open');
};
window.deleteTask = async (id) => { if (!confirm('Delete?')) return; await api('DELETE', `/api/tasks/${id}`); loadTasks(); };
document.getElementById('addBtn').addEventListener('click', () => {
  editingId = null; document.getElementById('formTitle').textContent = 'New Task';
  ['fTitle','fDesc','fAssigned','fDue'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fProgram').value = ''; document.getElementById('fPriority').value = 'medium'; document.getElementById('fStatus').value = 'pending';
  document.getElementById('formOverlay').classList.add('open');
});
document.getElementById('cancelBtn').addEventListener('click', () => document.getElementById('formOverlay').classList.remove('open'));
document.getElementById('saveBtn').addEventListener('click', async () => {
  const data = { title: document.getElementById('fTitle').value, description: document.getElementById('fDesc').value, assigned_to: document.getElementById('fAssigned').value, program_id: parseInt(document.getElementById('fProgram').value) || null, priority: document.getElementById('fPriority').value, status: document.getElementById('fStatus').value, due_date: document.getElementById('fDue').value || null };
  if (!data.title) return alert('Title is required');
  if (editingId) await api('PUT', `/api/tasks/${editingId}`, data); else await api('POST', '/api/tasks', data);
  document.getElementById('formOverlay').classList.remove('open'); loadTasks();
});
(async () => {
  const user = await getCurrentUser();
  if (!user) { window.location.href = '/login.html'; return; }
  document.getElementById('logoutBtn').addEventListener('click', async () => { await logout(); window.location.href = '/login.html'; });
  document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  try { const { programs } = await getPrograms(); document.getElementById('fProgram').innerHTML = '<option value="">— None —</option>' + programs.map(p => `<option value="${p.id}">${p.name}</option>`).join(''); document.getElementById('progFilter').innerHTML = '<option value="">All programs</option>' + programs.map(p => `<option value="${p.id}">${p.name}</option>`).join(''); } catch(e) {}
  loadTasks();
})();
</script>
</body>
</html>
