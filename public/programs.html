<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programs — Sammriddhi Trust</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
      .btn { background: var(--moss); color: #fff; border: none; padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: 500; }
      .btn:hover { background: var(--moss-deep); }
      .btn-s { padding: 0.3rem 0.8rem; font-size: 0.85rem; }
      .btn-danger { background: var(--clay); }
      .btn-danger:hover { background: #b13a2a; }
      .form-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center; }
      .form-overlay.open { display: flex; }
      .form-card { background: #fff; border-radius: 12px; padding: 2rem; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
      .form-card h2 { margin-top: 0; }
      .form-card label { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.3rem; color: var(--moss-deep); }
      .form-card input, .form-card select, .form-card textarea { width: 100%; padding: 0.55rem 0.7rem; border: 1.5px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 0.9rem; }
      .form-card textarea { min-height: 70px; resize: vertical; }
      .form-card .form-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }
      .programs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
      .program-card { background: #fff; border-radius: 10px; padding: 1.2rem; border: 1px solid var(--border); }
      .program-card h3 { margin: 0 0 0.3rem; }
      .program-card .meta { font-size: 0.85rem; color: #666; margin-bottom: 0.8rem; }
      .program-card .progress-text { display: flex; justify-content: space-between; font-size: 0.85rem; }
      .program-card .bar-track { height: 6px; background: #e8e8e8; border-radius: 3px; margin: 0.3rem 0 0.8rem; overflow: hidden; }
      .program-card .bar-fill { height: 100%; background: var(--moss); border-radius: 3px; }
      .program-card .card-actions { display: flex; gap: 0.4rem; margin-top: 0.8rem; }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
            <path d="M15 27C15 27 6 21.5 6 13.5C6 8.8 9.6 5 15 3C20.4 5 24 8.8 24 13.5C24 21.5 15 27 15 27Z" fill="#E3A23C" />
            <path d="M15 27V13" stroke="#33473C" stroke-width="1.6" stroke-linecap="round" />
            <path d="M15 18C15 18 10 16.5 10 12.5" stroke="#33473C" stroke-width="1.4" stroke-linecap="round" />
            <path d="M15 22C15 22 20 20.5 20 16" stroke="#33473C" stroke-width="1.4" stroke-linecap="round" />
          </svg>
          <div class="brand-name">Sammriddhi Trust<span>Foundation</span></div>
        </div>
        <nav>
          <a class="nav-item" href="index.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="1" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="9" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.3"/></svg>Overview</a>
          <a class="nav-item active" href="programs.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 13V6l6-3 6 3v7" stroke="currentColor" stroke-width="1.3"/><path d="M6 13V9h4v4" stroke="currentColor" stroke-width="1.3"/></svg>Programs</a>
          <a class="nav-item" href="beneficiaries.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="5" r="2.6" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 14c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke="currentColor" stroke-width="1.3"/></svg>Beneficiaries</a>
          <a class="nav-item" href="donors.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2c2.5 1 4 3 4 5.5C12 11 8 14 8 14S4 11 4 7.5C4 5 5.5 3 8 2Z" stroke="currentColor" stroke-width="1.3"/></svg>Donors</a>
          <a class="nav-item" href="finance.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1 4h14v10H1V4Z" stroke="currentColor" stroke-width="1.3"/><path d="M4 4V2h8v2" stroke="currentColor" stroke-width="1.3"/><path d="M5 8h6M5 10.5h4" stroke="currentColor" stroke-width="1.2"/></svg>Finance</a>
          <a class="nav-item" href="volunteers.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="6" cy="4.5" r="2.2" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 13c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4" stroke="currentColor" stroke-width="1.3"/><circle cx="11.5" cy="5" r="1.8" stroke="currentColor" stroke-width="1.3"/><path d="M10 12c0-1.8 1-3 3-3s3 1.2 3 3" stroke="currentColor" stroke-width="1.3"/></svg>Volunteers</a>
          <a class="nav-item" href="tasks.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 3h12v10H2V3Z" stroke="currentColor" stroke-width="1.3"/><path d="M5 8l2 2 4-4" stroke="currentColor" stroke-width="1.3"/></svg>Tasks</a>
          <a class="nav-item" href="reports.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 2h7l3 3v9H3V2Z" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 8h5M5.5 10.5h5" stroke="currentColor" stroke-width="1.2"/></svg>Field Reports</a>
          <a class="nav-item" href="notice.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v12M3 6h10M3 10h10" stroke="currentColor" stroke-width="1.3"/></svg>Notice Board</a>
          <a class="nav-item" href="inventory.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 7h12M2 10h12" stroke="currentColor" stroke-width="1.2"/></svg>Inventory</a>
          <a class="nav-item" href="events.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M8 5v4l2.5 1.5" stroke="currentColor" stroke-width="1.3"/></svg>Events</a>
          <a class="nav-item" href="impact.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 14V8l4-3 5 4 3-5v10H2Z" stroke="currentColor" stroke-width="1.3"/><circle cx="6" cy="5" r="1" fill="currentColor"/><circle cx="11" cy="9" r="1" fill="currentColor"/></svg>Impact Tracker</a>
          <a class="nav-item" href="settings.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 1v2M8 13v2M13 8h2M1 8h2M11.5 4.5l1.5-1.5M3 13l1.5-1.5M11.5 11.5L13 13M3 3l1.5 1.5" stroke="currentColor" stroke-width="1.3"/></svg>Settings</a>
        </nav>
        <div class="sidebar-footer">
          <strong>UTTAR PRADESH REGION</strong>
          <span id="regionInfo">Loading...</span>
          <button type="button" id="logoutBtn" class="logout-btn">Log out</button>
        </div>
      </aside>
      <main>
        <div class="topbar">
          <div>
            <div class="eyebrow">Program Management</div>
            <h1>Programs</h1>
          </div>
          <div class="topbar-meta">
            <span id="currentDate"></span>
          </div>
        </div>

        <div class="page-header">
          <div><strong id="programCount">0</strong> programs</div>
          <button class="btn" id="addProgramBtn">+ New Program</button>
        </div>

        <div class="programs-grid" id="programsGrid"></div>
      </main>
    </div>

    <div class="form-overlay" id="formOverlay">
      <div class="form-card">
        <h2 id="formTitle">New Program</h2>
        <label>Name</label>
        <input id="fName" required />
        <label>Description</label>
        <textarea id="fDesc"></textarea>
        <label>District</label>
        <input id="fDistrict" />
        <label>Villages</label>
        <input id="fVillages" type="number" />
        <label>Progress (%)</label>
        <input id="fProgress" type="number" min="0" max="100" />
        <label>Stage</label>
        <select id="fStage">
          <option>Sown</option>
          <option>Sprouting</option>
          <option>Growing</option>
          <option>Harvested</option>
        </select>
        <label>Target Amount (<span class="currency-symbol">₹</span>)</label>
        <input id="fTarget" type="number" />
        <label>Raised Amount (<span class="currency-symbol">₹</span>)</label>
        <input id="fRaised" type="number" />
        <div class="form-actions">
          <button class="btn btn-danger" id="cancelBtn">Cancel</button>
          <button class="btn" id="saveBtn">Save</button>
        </div>
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/org-loader.js"></script>
    <script>
      let editingId = null;
      const overlay = document.getElementById('formOverlay');
      const grid = document.getElementById('programsGrid');

      async function loadPrograms() {
        await window.orgSettingsPromise;
        const { programs } = await getPrograms();
        document.getElementById('programCount').textContent = programs.length;
        if (!programs.length) {
          grid.innerHTML = '<p style="color:#888">No programs yet. Click "+ New Program" to add one.</p>';
          return;
        }
        grid.innerHTML = programs.map(p => `
          <div class="program-card">
            <h3>${p.name}</h3>
            <div class="meta">${p.villages || 0} villages · ${p.district || '—'} · ${p.stage}</div>
            <div class="progress-text"><span>${window.formatCurrency(p.raised_amount)} raised</span><span>${p.progress_pct}%</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${p.progress_pct}%"></div></div>
            <div class="meta">Target: ${window.formatCurrency(p.target_amount)} · ${p.description || ''}</div>
            <div class="card-actions">
              <button class="btn btn-s" onclick="editProgram(${p.id})">Edit</button>
              <button class="btn btn-s btn-danger" onclick="deleteProgram(${p.id})">Delete</button>
            </div>
          </div>
        `).join('');
      }

      function resetForm() {
        editingId = null;
        document.getElementById('formTitle').textContent = 'New Program';
        ['fName','fDesc','fDistrict','fVillages','fProgress','fTarget','fRaised'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('fStage').value = 'Sown';
      }

      window.editProgram = async (id) => {
        editingId = id;
        const { program } = await getProgram(id);
        document.getElementById('formTitle').textContent = 'Edit Program';
        document.getElementById('fName').value = program.name;
        document.getElementById('fDesc').value = program.description || '';
        document.getElementById('fDistrict').value = program.district || '';
        document.getElementById('fVillages').value = program.villages || 0;
        document.getElementById('fProgress').value = program.progress_pct || 0;
        document.getElementById('fStage').value = program.stage || 'Sown';
        document.getElementById('fTarget').value = program.target_amount || 0;
        document.getElementById('fRaised').value = program.raised_amount || 0;
        overlay.classList.add('open');
      };

      window.deleteProgram = async (id) => {
        if (!confirm('Delete this program?')) return;
        await api('DELETE', `/api/programs/${id}`);
        loadPrograms();
      };

      document.getElementById('addProgramBtn').addEventListener('click', () => {
        resetForm();
        overlay.classList.add('open');
      });

      document.getElementById('cancelBtn').addEventListener('click', () => {
        overlay.classList.remove('open');
      });

      document.getElementById('saveBtn').addEventListener('click', async () => {
        const data = {
          name: document.getElementById('fName').value,
          description: document.getElementById('fDesc').value,
          district: document.getElementById('fDistrict').value,
          villages: parseInt(document.getElementById('fVillages').value) || 0,
          progress_pct: parseFloat(document.getElementById('fProgress').value) || 0,
          stage: document.getElementById('fStage').value,
          target_amount: parseFloat(document.getElementById('fTarget').value) || 0,
          raised_amount: parseFloat(document.getElementById('fRaised').value) || 0
        };
        if (!data.name) return alert('Name is required');
        if (editingId) {
          await updateProgram(editingId, data);
        } else {
          await createProgram(data);
        }
        overlay.classList.remove('open');
        loadPrograms();
      });

      // Auth + load
      (async () => {
        const user = await getCurrentUser();
        if (!user) { window.location.href = '/login.html'; return; }
        document.getElementById('logoutBtn').addEventListener('click', async () => { await logout(); window.location.href = '/login.html'; });
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        loadPrograms();
      })();
    </script>
  </body>
</html>
