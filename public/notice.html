<style>
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.btn{background:var(--moss);color:#fff;border:none;padding:.5rem 1.2rem;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:500}
.btn:hover{background:var(--moss-deep)}
.btn-s{padding:.3rem .8rem;font-size:.85rem}
.btn-danger{background:var(--clay)}
.btn-danger:hover{background:#b13a2a}
.form-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center}
.form-overlay.open{display:flex}
.form-card{background:#fff;border-radius:12px;padding:2rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.form-card h2{margin-top:0}
.form-card label{display:block;font-size:.85rem;font-weight:600;margin-top:1rem;margin-bottom:.3rem;color:var(--moss-deep)}
.form-card input,.form-card select,.form-card textarea{width:100%;padding:.55rem .7rem;border:1.5px solid #ddd;border-radius:6px;font-family:inherit;font-size:.9rem}
.form-card textarea{min-height:100px}
.form-card .form-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.5rem}
.announcements{display:flex;flex-direction:column;gap:1rem}
.ann-card{background:#fff;border-radius:10px;padding:1.2rem;border:1px solid var(--border);border-left:4px solid var(--moss)}
.ann-card.high{border-left-color:var(--clay)}
.ann-card.normal{border-left-color:var(--moss)}
.ann-card .ann-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.5rem}
.ann-card .ann-title{font-weight:600;font-size:1.05rem}
.ann-card .ann-meta{font-size:.8rem;color:#888;margin-bottom:.5rem}
.ann-card .ann-content{font-size:.9rem;line-height:1.5;color:#444}
.pill{display:inline-block;padding:.1rem .4rem;border-radius:12px;font-size:.75rem;font-weight:500}
.pill.high{background:#fde8e8;color:#b13a2a}
.pill.normal{background:#e8f0e8;color:#2a6e3a}
</style>
</head>

<main>
<div class="topbar"><div><div class="eyebrow">Internal Communications</div><h1>Notice Board</h1></div><div class="topbar-meta"><span id="currentDate"></span></div></div>
<div class="page-header"><div><strong id="annCount">0</strong> announcements</div><button class="btn" id="addBtn">+ New Announcement</button></div>
<div class="announcements" id="annList"></div>
</main>
</div>
<div class="form-overlay" id="formOverlay">
<div class="form-card"><h2>New Announcement</h2>
<label>Title</label><input id="fTitle" required />
<label>Content</label><textarea id="fContent" required></textarea>
<label>Author</label><input id="fAuthor" />
<label>Priority</label><select id="fPriority"><option value="normal">Normal</option><option value="high">High</option></select>
<div class="form-actions"><button class="btn btn-danger" id="cancelBtn">Cancel</button><button class="btn" id="saveBtn">Post</button></div>
</div></div>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/org-loader.js"></script>
<script>
async function loadAnnouncements() {
  const res = await api('GET', '/api/announcements');
  document.getElementById('annCount').textContent = res.announcements.length;
  const list = document.getElementById('annList');
  if (!res.announcements.length) { list.innerHTML = '<p style="color:#888;text-align:center;padding:2rem">No announcements yet.</p>'; return; }
  list.innerHTML = res.announcements.map(a => `
    <div class="ann-card ${a.priority}">
      <div class="ann-head">
        <div><div class="ann-title">${a.title}</div></div>
        <span class="pill ${a.priority}">${a.priority}</span>
      </div>
      <div class="ann-meta">${a.author ? 'By ' + a.author + ' · ' : ''}${a.created_at}</div>
      <div class="ann-content">${a.content}</div>
      <div style="margin-top:.5rem"><button class="btn btn-s btn-danger" onclick="deleteAnn(${a.id})">Delete</button></div>
    </div>`).join('');
}
window.deleteAnn = async (id) => { if (!confirm('Delete?')) return; await api('DELETE', `/api/announcements/${id}`); loadAnnouncements(); };
document.getElementById('addBtn').addEventListener('click', () => {
  ['fTitle','fContent','fAuthor'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fPriority').value = 'normal';
  document.getElementById('formOverlay').classList.add('open');
});
document.getElementById('cancelBtn').addEventListener('click', () => document.getElementById('formOverlay').classList.remove('open'));
document.getElementById('saveBtn').addEventListener('click', async () => {
  const data = { title: document.getElementById('fTitle').value, content: document.getElementById('fContent').value, author: document.getElementById('fAuthor').value, priority: document.getElementById('fPriority').value };
  if (!data.title || !data.content) return alert('Title and content are required');
  await api('POST', '/api/announcements', data);
  document.getElementById('formOverlay').classList.remove('open'); loadAnnouncements();
});
(async () => {
  const user = await getCurrentUser();
  if (!user) { window.location.href = '/login.html'; return; }
  document.getElementById('logoutBtn').addEventListener('click', async () => { await logout(); window.location.href = '/login.html'; });
  document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  loadAnnouncements();
})();
</script>
