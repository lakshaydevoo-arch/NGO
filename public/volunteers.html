<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:.5rem}
.vol-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
.vol-card{background:#fff;border-radius:10px;padding:1rem;border:1px solid var(--border)}
.vol-card .label{font-size:.8rem;color:#888;text-transform:uppercase}
.vol-card .value{font-size:1.3rem;font-weight:700;margin-top:.2rem}
.btn{background:var(--moss);color:#fff;border:none;padding:.5rem 1.2rem;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:500}
.btn:hover{background:var(--moss-deep)}
.btn-s{padding:.3rem .8rem;font-size:.85rem}
.btn-danger{background:var(--clay)}
.btn-danger:hover{background:#b13a2a}
.form-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center}
.form-overlay.open{display:flex}
.form-card{background:#fff;border-radius:12px;padding:2rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.form-card h2{margin-top:0}
.form-card label{display:block;font-size:.85rem;font-weight:600;margin-top:1rem;margin-bottom:.3rem;color:var(--moss-deep)}
.form-card input,.form-card select,.form-card textarea{width:100%;padding:.55rem .7rem;border:1.5px solid #ddd;border-radius:6px;font-family:inherit;font-size:.9rem}
.form-card .form-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.5rem}
.table-wrap{overflow-x:auto;background:#fff;border-radius:10px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:.7rem 1rem;text-align:left;border-bottom:1px solid #eee}
th{background:#f9faf8;font-weight:600;color:var(--moss-deep);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
.status-badge{display:inline-block;padding:.15rem .5rem;border-radius:20px;font-size:.8rem;font-weight:500}
.status-badge.active{background:#e0f0e0;color:#2a6e3a}
.status-badge.inactive{background:#f0e0e0;color:#8a3a3a}
</style>
</head>
<body>

<div class="brand-name">Sammriddhi Trust<span>Foundation</span></div></div>

  <a class="nav-item" href="beneficiaries.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="5" r="2.6" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 14c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke="currentColor" stroke-width="1.3"/></svg>Beneficiaries</a>

  <a class="nav-item" href="finance.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1 4h14v10H1V4Z" stroke="currentColor" stroke-width="1.3"/><path d="M4 4V2h8v2" stroke="currentColor" stroke-width="1.3"/><path d="M5 8h6M5 10.5h4" stroke="currentColor" stroke-width="1.2"/></svg>Finance</a>

  <a class="nav-item" href="settings.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 1v2M8 13v2M13 8h2M1 8h2M11.5 4.5l1.5-1.5M3 13l1.5-1.5M11.5 11.5L13 13M3 3l1.5 1.5" stroke="currentColor" stroke-width="1.3"/></svg>Settings</a>
</nav>
<div class="sidebar-footer"><strong>UTTAR PRADESH REGION</strong><button type="button" id="logoutBtn" class="logout-btn">Log out</button></div>

<main>
<div class="topbar"><div><div class="eyebrow">Volunteer Management</div><h1>Volunteers</h1></div><div class="topbar-meta"><span id="currentDate"></span></div></div>
<div class="vol-summary" id="summaryCards"></div>
<div class="page-header"><div><strong id="volCount">0</strong> volunteers</div><button class="btn" id="addBtn">+ Add Volunteer</button></div>
<div class="table-wrap">
<table><thead><tr><th>Name</th><th>Email</th><th>District</th><th>Program</th><th>Hours Committed</th><th>Hours Logged</th><th>Status</th><th></th></tr></thead>
<tbody id="tableBody"></tbody></table>
</div>
</main>
</div>
<div class="form-overlay" id="formOverlay">
<div class="form-card"><h2 id="formTitle">Add Volunteer</h2>
<label>Name</label><input id="fName" required />
<label>Email</label><input id="fEmail" type="email" />
<label>Phone</label><input id="fPhone" />
<label>District</label><input id="fDistrict" />
<label>Program</label><select id="fProgram"><option value="">— Any —</option></select>
<label>Hours Committed (monthly)</label><input id="fHours" type="number" />
<label>Status</label><select id="fStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select>
<div class="form-actions"><button class="btn btn-danger" id="cancelBtn">Cancel</button><button class="btn" id="saveBtn">Save</button></div>
</div></div>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/org-loader.js"></script>
<script>
let editingId = null;
async function loadVolunteers() {
  const res = await api('GET', '/api/volunteers');
  document.getElementById('summaryCards').innerHTML = `
    <div class="vol-card"><div class="label">Active Volunteers</div><div class="value" style="color:var(--moss)">${res.total_active}</div></div>
    <div class="vol-card"><div class="label">Total Hours Logged</div><div class="value" style="color:var(--marigold)">${res.total_hours}</div></div>
    <div class="vol-card"><div class="label">Avg Hours / Volunteer</div><div class="value" style="color:var(--sky)">${res.total_active ? (res.total_hours / res.total_active).toFixed(1) : 0}</div></div>`;
  document.getElementById('volCount').textContent = res.volunteers.length;
  const tbody = document.getElementById('tableBody');
  if (!res.volunteers.length) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#888;padding:2rem">No volunteers.</td></tr>'; return; }
  tbody.innerHTML = res.volunteers.map(v => `
    <tr><td><strong>${v.name}</strong></td><td>${v.email || '—'}</td><td>${v.district || '—'}</td>
    <td>${v.program_name || '—'}</td><td>${v.hours_committed || 0}h</td><td>${v.total_hours_logged || 0}h</td>
    <td><span class="status-badge ${v.status}">${v.status}</span></td>
    <td><button class="btn btn-s" onclick="editVol(${v.id})">Edit</button>
    <button class="btn btn-s" onclick="logHours(${v.id})">+ Hours</button>
    <button class="btn btn-s btn-danger" onclick="deleteVol(${v.id})">Delete</button></td></tr>`).join('');
}
window.editVol = async (id) => {
  editingId = id;
  const { volunteer } = await api('GET', `/api/volunteers/${id}`);
  document.getElementById('formTitle').textContent = 'Edit Volunteer';
  document.getElementById('fName').value = volunteer.name;
  document.getElementById('fEmail').value = volunteer.email || '';
  document.getElementById('fPhone').value = volunteer.phone || '';
  document.getElementById('fDistrict').value = volunteer.district || '';
  document.getElementById('fProgram').value = volunteer.program_id || '';
  document.getElementById('fHours').value = volunteer.hours_committed || '';
  document.getElementById('fStatus').value = volunteer.status || 'active';
  document.getElementById('formOverlay').classList.add('open');
};
window.deleteVol = async (id) => { if (!confirm('Delete?')) return; await api('DELETE', `/api/volunteers/${id}`); loadVolunteers(); };
window.logHours = async (id) => {
  const hrs = prompt('Enter hours to log:');
  if (!hrs || isNaN(hrs)) return;
  await api('POST', `/api/volunteers/${id}/hours`, { hours: parseFloat(hrs), description: 'Manual entry', logged_date: new Date().toISOString().slice(0,10) });
  loadVolunteers();
};
document.getElementById('addBtn').addEventListener('click', () => {
  editingId = null; document.getElementById('formTitle').textContent = 'Add Volunteer';
  ['fName','fEmail','fPhone','fDistrict','fHours'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fProgram').value = ''; document.getElementById('fStatus').value = 'active';
  document.getElementById('formOverlay').classList.add('open');
});
document.getElementById('cancelBtn').addEventListener('click', () => document.getElementById('formOverlay').classList.remove('open'));
document.getElementById('saveBtn').addEventListener('click', async () => {
  const data = { name: document.getElementById('fName').value, email: document.getElementById('fEmail').value, phone: document.getElementById('fPhone').value, district: document.getElementById('fDistrict').value, program_id: parseInt(document.getElementById('fProgram').value) || null, hours_committed: parseFloat(document.getElementById('fHours').value) || 0, status: document.getElementById('fStatus').value };
  if (!data.name) return alert('Name is required');
  if (editingId) await api('PUT', `/api/volunteers/${editingId}`, data); else await api('POST', '/api/volunteers', data);
  document.getElementById('formOverlay').classList.remove('open'); loadVolunteers();
});
(async () => {
  const user = await getCurrentUser();
  if (!user) { window.location.href = '/login.html'; return; }
  document.getElementById('logoutBtn').addEventListener('click', async () => { await logout(); window.location.href = '/login.html'; });
  document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  try { const { programs } = await getPrograms(); document.getElementById('fProgram').innerHTML = '<option value="">— Any —</option>' + programs.map(p => `<option value="${p.id}">${p.name}</option>`).join(''); } catch(e) {}
  loadVolunteers();
})();
</script>
</body>
</html>
